<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>부부 가계부</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #18181b;
      --sub: #71717a;
      --line: #e4e4e7;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --danger: #dc2626;
      --danger-soft: #fef2f2;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 96px;
    }
    .wrap { max-width: 520px; margin: 0 auto; padding: 12px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }
    .cal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .cal-title { font-size: 17px; font-weight: 700; }
    .nav-group { display: flex; gap: 6px; align-items: center; }
    .nav-btn {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 10px;
      padding: 6px 11px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: var(--text);
    }
    .weekdays, .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
    }
    .weekdays div {
      font-size: 12px;
      color: var(--sub);
      padding: 4px 0;
      font-weight: 600;
    }
    .day-btn {
      border: 1px solid transparent;
      background: transparent;
      border-radius: 10px;
      min-height: 52px;
      padding: 4px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      cursor: pointer;
      color: var(--text);
    }
    .day-btn.muted { color: #d4d4d8; cursor: default; }
    .day-btn.today .day-num {
      background: #18181b;
      color: #fff;
      width: 22px;
      height: 22px;
      line-height: 22px;
      border-radius: 999px;
    }
    .day-btn.selected {
      background: var(--accent-soft);
      border-color: var(--accent);
      font-weight: 700;
    }
    .day-num { font-size: 13px; }
    .day-sum {
      font-size: 10px;
      color: var(--danger);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      max-width: 100%;
    }
    .list-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
    }
    .list-title { font-size: 15px; font-weight: 700; }
    .list-total { font-size: 15px; font-weight: 700; color: var(--danger); }
    .filter-row {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .chip {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--sub);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .chip.active {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }
    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 4px;
      border-top: 1px solid #f0f0f3;
      cursor: pointer;
    }
    .item:first-child { border-top: none; }
    .item:active { background: #fafafa; }
    .item-main { font-size: 14px; font-weight: 600; }
    .item-sub { font-size: 12px; color: var(--sub); margin-top: 2px; }
    .item-amt { font-size: 14px; font-weight: 700; white-space: nowrap; margin-left: 8px; }
    .empty { text-align: center; color: var(--sub); padding: 22px 0; font-size: 13px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .form-grid .full { grid-column: 1 / -1; }
    input, select {
      width: 100%;
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 15px;
      background: #fff;
      color: var(--text);
    }
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-primary { background: var(--accent); color: #fff; margin-top: 10px; }
    .btn-danger { background: var(--danger-soft); color: var(--danger); border: 1px solid #fecaca; }
    .btn-ghost { background: #f4f4f5; color: var(--text); }
    .status { font-size: 12px; color: var(--sub); margin-top: 8px; min-height: 16px; }

    .fab-add {
      position: fixed;
      right: 20px;
      bottom: 24px;
      width: 56px;
      height: 56px;
      border: none;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 40;
    }
    .fab-add:active { transform: scale(0.95); }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 50;
    }
    .modal-backdrop.open { display: flex; }
    .modal-sheet {
      width: 100%;
      max-width: 520px;
      background: #fff;
      border-radius: 20px 20px 0 0;
      padding: 18px 16px 28px;
    }
    .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; }
    .modal-actions { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; margin-top: 12px; }
  </style>
</head>
<body>

    <div class="card">
      <div class="cal-header">
        <div class="cal-title" id="monthLabel"></div>
        <div class="nav-group">
          <button type="button" class="nav-btn" id="todayBtn">오늘</button>
          <button type="button" class="nav-btn" id="prevMonth">◀</button>
          <button type="button" class="nav-btn" id="nextMonth">▶</button>
        </div>
      </div>
      <div class="weekdays">
        <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
      </div>
      <div class="days" id="calendarDays"></div>
    </div>

    <div class="card">
      <div class="list-top">
        <div class="list-title" id="selectedDateLabel"></div>
        <div class="list-total" id="selectedDateTotal">0원</div>
