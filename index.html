<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>부부 가계부</title>
  <style>
    :root { --bg:#f4f6f8; --card:#fff; --text:#18181b; --sub:#71717a; --line:#e4e4e7; --accent:#2563eb; --accent-soft:#eff6ff; --danger:#dc2626; --danger-soft:#fef2f2; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif; background:var(--bg); color:var(--text); padding-bottom:96px; }
    .wrap { max-width:520px; margin:0 auto; padding:12px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:12px; box-shadow:0 1px 2px rgba(0,0,0,0.03); }
    .cal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
    .cal-title { font-size:17px; font-weight:700; }
    .nav-group { display:flex; gap:6px; align-items:center; }
    .nav-btn { border:1px solid var(--line); background:#fff; border-radius:10px; padding:6px 10px; font-size:13px; font-weight:600; cursor:pointer; color:var(--text); }
    .weekdays,.days { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center; }
    .weekdays div { font-size:12px; color:var(--sub); padding:4px 0; font-weight:600; }
    .day-btn { border:1px solid transparent; background:transparent; border-radius:10px; min-height:52px; padding:4px 2px; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; cursor:pointer; color:var(--text); }
    .day-btn.muted { color:#d4d4d8; cursor:default; }
    .day-btn.today .day-num { background:#18181b; color:#fff; width:22px; height:22px; line-height:22px; border-radius:999px; }
    .day-btn.selected { background:var(--accent-soft); border-color:var(--accent); font-weight:700; }
    .day-num { font-size:13px; }
    .day-sum { font-size:10px; color:var(--danger); margin-top:2px; white-space:nowrap; overflow:hidden; max-width:100%; }
    .list-top { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
    .list-title { font-size:15px; font-weight:700; }
    .list-total { font-size:15px; font-weight:700; color:var(--danger); }
    .filter-row { display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap; }
    .chip { border:1px solid var(--line); background:#fff; color:var(--sub); border-radius:999px; padding:4px 10px; font-size:12px; font-weight:600; cursor:pointer; }
    .chip.active { background:var(--text); color:#fff; border-color:var(--text); }
    .item { display:flex; justify-content:space-between; align-items:center; padding:11px 4px; border-top:1px solid #f0f0f3; cursor:pointer; }
    .item:first-child { border-top:none; }
    .item:active { background:#fafafa; }
    .item-main { font-size:14px; font-weight:600; }
    .item-sub { font-size:12px; color:var(--sub); margin-top:2px; }
    .item-amt { font-size:14px; font-weight:700; white-space:nowrap; margin-left:8px; }
    .empty { text-align:center; color:var(--sub); padding:22px 0; font-size:13px; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .form-grid .full { grid-column:1 / -1; }
    input,select { width:100%; padding:11px; border:1px solid var(--line); border-radius:10px; font-size:15px; background:#fff; color:var(--text); }
    .btn { width:100%; padding:12px; border:none; border-radius:12px; font-size:15px; font-weight:700; cursor:pointer; }
    .btn-primary { background:var(--accent); color:#fff; margin-top:10px; }
    .btn-danger { background:var(--danger-soft); color:var(--danger); border:1px solid #fecaca; }
    .btn-ghost { background:#f4f4f5; color:var(--text); }
    .status { font-size:12px; color:var(--sub); margin-top:8px; min-height:16px; }
    .fab-add { position:fixed; right:20px; bottom:24px; width:56px; height:56px; border:none; border-radius:999px; background:var(--accent); color:#fff; box-shadow:0 6px 18px rgba(37,99,235,0.35); display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:40; }
    .fab-add:active { transform:scale(0.95); }
    .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,0.45); display:none; align-items:flex-end; justify-content:center; z-index:50; }
    .modal-backdrop.open { display:flex; }
    .modal-sheet { width:100%; max-width:520px; max-height:86vh; overflow-y:auto; background:#fff; border-radius:20px 20px 0 0; padding:18px 16px 28px; }
    .modal-title { font-size:16px; font-weight:700; margin-bottom:12px; }
    .modal-actions { display:grid; grid-template-columns:1fr 2fr; gap:8px; margin-top:12px; }
    .setting-sec { margin-bottom:14px; }
    .setting-sec-title { font-size:13px; font-weight:700; color:var(--sub); margin-bottom:6px; }
    .tag-list { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
    .tag-pill { display:inline-flex; align-items:center; gap:6px; background:#f4f4f5; border:1px solid var(--line); border-radius:999px; padding:5px 10px; font-size:13px; font-weight:600; }
    .tag-del { border:none; background:transparent; color:var(--danger); font-size:14px; font-weight:700; cursor:pointer; padding:0 2px; }
    .add-inline { display:flex; gap:6px; }
    .add-inline input { padding:9px 11px; font-size:14px; }
    .add-inline button { width:auto; padding:0 14px; border-radius:10px; border:none; background:var(--text); color:#fff; font-size:13px; font-weight:700; cursor:pointer; white-space:nowrap; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="cal-header">
        <div class="cal-title" id="monthLabel"></div>
        <div class="nav-group">
          <button type="button" class="nav-btn" id="openSettingsBtn">⚙ 설정</button>
          <button type="button" class="nav-btn" id="todayBtn">오늘</button>
          <button type="button" class="nav-btn" id="prevMonth">◀</button>
          <button type="button" class="nav-btn" id="nextMonth">▶</button>
        </div>
      </div>
      <div class="weekdays"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
      <div class="days" id="calendarDays"></div>
    </div>

    <div class="card">
      <div class="list-top">
        <div class="list-title" id="selectedDateLabel"></div>
        <div class="list-total" id="selectedDateTotal">0원</div>
      </div>
      <div class="filter-row">
        <button type="button" class="chip active" data-author="ALL">전체</button>
        <button type="button" class="chip" data-author="연근">연근</button>
        <button type="button" class="chip" data-author="귤이">귤이</button>
      </div>
      <div id="expenseList"></div>
      <div class="status" id="statusMsg"></div>
    </div>
  </div>

  <button type="button" class="fab-add" id="openAddBtn" aria-label="지출 추가">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
  </button>

  <div class="modal-backdrop" id="addModal">
    <div class="modal-sheet">
      <div class="modal-title">지출 추가 (<span id="formDateText"></span>)</div>
      <div class="form-grid">
        <div>
          <select id="author">
            <option value="연근">작성자: 연근</option>
            <option value="귤이">작성자: 귤이</option>
          </select>
        </div>
        <div><select id="category"></select></div>
        <div><input type="text" id="merchant" placeholder="사용처 (예: 마트)" /></div>
        <div><input type="number" id="amount" placeholder="금액 (원)" inputmode="numeric" /></div>
        <div class="full"><select id="payment"></select></div>
        <div class="full"><input type="text" id="memo" placeholder="메모 (선택)" /></div>
      </div>
      <button type="button" class="btn btn-primary" id="saveBtn">저장하기</button>
      <button type="button" class="btn btn-ghost" style="margin-top:8px;" id="closeAddBtn">닫기</button>
    </div>
  </div>

  <div class="modal-backdrop" id="editModal">
    <div class="modal-sheet">
      <div class="modal-title">내역 수정 / 삭제</div>
      <input type="hidden" id="editId" />
      <div class="form-grid">
        <div><input type="date" id="editDate" /></div>
        <div>
          <select id="editAuthor">
            <option value="연근">연근</option>
            <option value="귤이">귤이</option>
          </select>
        </div>
        <div><select id="editCategory"></select></div>
        <div><input type="number" id="editAmount" inputmode="numeric" placeholder="금액" /></div>
        <div><input type="text" id="editMerchant" placeholder="사용처" /></div>
        <div><select id="editPayment"></select></div>
        <div class="full"><input type="text" id="editMemo" placeholder="메모" /></div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-danger" id="deleteItemBtn">삭제</button>
        <button type="button" class="btn btn-primary" style="margin-top:0;" id="updateItemBtn">수정 저장</button>
      </div>
      <button type="button" class="btn btn-ghost" style="margin-top:8px;" id="closeModalBtn">닫기</button>
    </div>
  </div>

  <div class="modal-backdrop" id="settingsModal">
    <div class="modal-sheet">
      <div class="modal-title">카테고리 · 결제수단 설정 (시트 공용 저장)</div>
      <div class="setting-sec">
        <div class="setting-sec-title">카테고리</div>
        <div class="tag-list" id="settingCategoryTags"></div>
        <div class="add-inline">
          <input type="text" id="newCategoryInput" placeholder="새 카테고리 이름" />
          <button type="button" id="addCategoryTagBtn">추가</button>
        </div>
      </div>
      <div class="setting-sec">
        <div class="setting-sec-title">결제수단</div>
        <div class="tag-list" id="settingPaymentTags"></div>
        <div class="add-inline">
          <input type="text" id="newPaymentInput" placeholder="새 결제수단 (예: 우리카드)" />
          <button type="button" id="addPaymentTagBtn">추가</button>
        </div>
      </div>
      <button type="button" class="btn btn-primary" id="saveSettingsBtn">설정 저장</button>
      <button type="button" class="btn btn-ghost" style="margin-top:8px;" id="closeSettingsBtn">닫기</button>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbzQHw2S8p9mXDnnxRcdtbNOZTawJv66xw3RB82f2km96nCfgVze0xAU8uMknbf4u6Gd8g/exec';

    let expenses = [];
    let categories = ['식비','보험','카페','교통','회비','쇼핑','통신','생필품','관리비','구독서비스','마트','문화','건강'];
    let payments = ['카드','체크카드','계좌이체','현금','기타'];
    let draftCategories = [];
    let draftPayments = [];
    let authorFilter = 'ALL';

    const todayStr = formatYMD(new Date());
    let viewYear = Number(todayStr.slice(0, 4));
    let viewMonth = Number(todayStr.slice(5, 7)) - 1;
    let selectedDate = todayStr;

    function formatYMD(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function formatShortAmount(n) {
      if (!n) return '';
      if (n >= 10000) return `${(n / 10000).toFixed(n % 10000 === 0 ? 0 : 1)}만`;
      return `${n.toLocaleString()}`;
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
    }

    function normalizeAuthor(author) {
      if (author === '나') return '연근';
      if (author === '배우자') return '귤이';
      return author;
    }

    function setStatus(msg) {
      document.getElementById('statusMsg').textContent = msg || '';
    }

    function renderSelectOptions() {
      const catHtml = categories.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
      const payAddHtml = payments.map(p => `<option value="${escapeHtml(p)}">결제수단: ${escapeHtml(p)}</option>`).join('');
      const payEditHtml = payments.map(p => `<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join('');

      document.getElementById('category').innerHTML = catHtml;
      document.getElementById('editCategory').innerHTML = catHtml;
      document.getElementById('payment').innerHTML = payAddHtml;
      document.getElementById('editPayment').innerHTML = payEditHtml;
    }

    async function apiGetInit() {
      const res = await fetch(`${API_URL}?action=init`);
      const json = await res.json();
      if (!json.ok) throw new Error(json.error || '조회 실패');
      return json.data || {};
    }

    async function apiPost(payload) {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const json = await res.json();
      if (!json.ok) throw new Error(json.error || '처리 실패');
      return json.data;
    }

    function renderCalendar() {
      const monthLabel = document.getElementById('monthLabel');
      const daysEl = document.getElementById('calendarDays');
      monthLabel.textContent = `${viewYear}년 ${viewMonth + 1}월`;
      daysEl.innerHTML = '';

      const firstDay = new Date(viewYear, viewMonth, 1).getDay();
      const lastDate = new Date(viewYear, viewMonth + 1, 0).getDate();
      const dailySum = {};

      expenses.forEach(e => {
        if (!e.date) return;
        if (authorFilter !== 'ALL' && e.author !== authorFilter) return;
        dailySum[e.date] = (dailySum[e.date] || 0) + Number(e.amount || 0);
      });

      for (let i = 0; i < firstDay; i++) {
        const blank = document.createElement('div');
        blank.className = 'day-btn muted';
        daysEl.appendChild(blank);
      }

      for (let d = 1; d <= lastDate; d++) {
        const ymd = `${viewYear}-${String(viewMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const btn = document.createElement('button');
        btn.type = 'button';
        let cls = 'day-btn';
        if (ymd === todayStr) cls += ' today';
        if (ymd === selectedDate) cls += ' selected';
        btn.className = cls;

        const sumText = dailySum[ymd] ? `-${formatShortAmount(dailySum[ymd])}` : '';
        btn.innerHTML = `<span class="day-num">${d}</span><span class="day-sum">${sumText}</span>`;
        btn.onclick = () => {
          selectedDate = ymd;
          renderCalendar();
          renderList();
          updateFormDate();
        };
        daysEl.appendChild(btn);
      }
    }

    function renderList() {
      const labelEl = document.getElementById('selectedDateLabel');
      const totalEl = document.getElementById('selectedDateTotal');
      const listEl = document.getElementById('expenseList');
      labelEl.textContent = `${selectedDate} 지출`;

      const dayItems = expenses.filter(e => {
        if (e.date !== selectedDate) return false;
        if (authorFilter !== 'ALL' && e.author !== authorFilter) return false;
        return true;
      });

      const total = dayItems.reduce((acc, cur) => acc + Number(cur.amount || 0), 0);
      totalEl.textContent = `${total.toLocaleString()}원`;

      if (dayItems.length === 0) {
        listEl.innerHTML = '<div class="empty">표시할 지출 내역이 없습니다.</div>';
        return;
      }

      listEl.innerHTML = dayItems.map(item => `
        <div class="item" data-id="${escapeHtml(item.id)}">
          <div>
            <div class="item-main">[${escapeHtml(item.category)}] ${escapeHtml(item.merchant || '내역 없음')}</div>
            <div class="item-sub">${escapeHtml(item.author)} · ${escapeHtml(item.payment || '카드')}${item.memo ? ' · ' + escapeHtml(item.memo) : ''}</div>
          </div>
          <div class="item-amt">-${Number(item.amount || 0).toLocaleString()}원</div>
        </div>
      `).join('');

      listEl.querySelectorAll('.item').forEach(el => {
        el.onclick = () => openEditModal(el.getAttribute('data-id'));
      });
    }

    function updateFormDate() {
      document.getElementById('formDateText').textContent = selectedDate;
    }

    function openAddModal() {
      updateFormDate();
      document.getElementById('addModal').classList.add('open');
    }

    function closeAddModal() {
      document.getElementById('addModal').classList.remove('open');
    }

    function openEditModal(id) {
      const target = expenses.find(e => String(e.id) === String(id));
      if (!target) return;
      document.getElementById('editId').value = target.id;
      document.getElementById('editDate').value = target.date;
      document.getElementById('editAuthor').value = target.author;

      const editCatEl = document.getElementById('editCategory');
      if (!categories.includes(target.category)) {
        editCatEl.innerHTML = `<option value="${escapeHtml(target.category)}">${escapeHtml(target.category)}</option>` + editCatEl.innerHTML;
      }
      editCatEl.value = target.category;

      const editPayEl = document.getElementById('editPayment');
      const payVal = target.payment || '카드';
      if (!payments.includes(payVal)) {
        editPayEl.innerHTML = `<option value="${escapeHtml(payVal)}">${escapeHtml(payVal)}</option>` + editPayEl.innerHTML;
      }
      editPayEl.value = payVal;

      document.getElementById('editMerchant').value = target.merchant;
      document.getElementById('editAmount').value = target.amount;
      document.getElementById('editMemo').value = target.memo;
      document.getElementById('editModal').classList.add('open');
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.remove('open');
      renderSelectOptions();
    }

    function renderSettingsTags() {
      const catBox = document.getElementById('settingCategoryTags');
      const payBox = document.getElementById('settingPaymentTags');

      catBox.innerHTML = draftCategories.map((c, idx) => `
        <span class="tag-pill">${escapeHtml(c)}<button type="button" class="tag-del" data-type="cat" data-idx="${idx}">×</button></span>
      `).join('');

      payBox.innerHTML = draftPayments.map((p, idx) => `
        <span class="tag-pill">${escapeHtml(p)}<button type="button" class="tag-del" data-type="pay" data-idx="${idx}">×</button></span>
      `).join('');

      document.querySelectorAll('.tag-del').forEach(btn => {
        btn.onclick = () => {
          const type = btn.getAttribute('data-type');
          const idx = Number(btn.getAttribute('data-idx'));
          if (type === 'cat' && draftCategories.length > 1) draftCategories.splice(idx, 1);
          if (type === 'pay' && draftPayments.length > 1) draftPayments.splice(idx, 1);
          renderSettingsTags();
        };
      });
    }

    function openSettingsModal() {
      draftCategories = categories.slice();
      draftPayments = payments.slice();
      renderSettingsTags();
      document.getElementById('settingsModal').classList.add('open');
    }

    function closeSettingsModal() {
      document.getElementById('settingsModal').classList.remove('open');
    }

    document.getElementById('openAddBtn').onclick = openAddModal;
    document.getElementById('closeAddBtn').onclick = closeAddModal;
    document.getElementById('openSettingsBtn').onclick = openSettingsModal;
    document.getElementById('closeSettingsBtn').onclick = closeSettingsModal;

    document.getElementById('addCategoryTagBtn').onclick = () => {
      const inp = document.getElementById('newCategoryInput');
      const val = inp.value.trim();
      if (val && !draftCategories.includes(val)) {
        draftCategories.push(val);
        renderSettingsTags();
      }
      inp.value = '';
    };

    document.getElementById('addPaymentTagBtn').onclick = () => {
      const inp = document.getElementById('newPaymentInput');
      const val = inp.value.trim();
      if (val && !draftPayments.includes(val)) {
        draftPayments.push(val);
        renderSettingsTags();
      }
      inp.value = '';
    };

    document.getElementById('saveSettingsBtn').onclick = async () => {
      closeSettingsModal();
      setStatus('설정 저장 중...');
      try {
        const saved = await apiPost({
          action: 'saveSettings',
          settings: { categories: draftCategories, payments: draftPayments }
        });
        categories = saved.categories || draftCategories;
        payments = saved.payments || draftPayments;
        renderSelectOptions();
        setStatus('설정 저장 완료');
      } catch (err) {
        setStatus('설정 저장 실패: ' + err.message);
      }
    };

    document.querySelectorAll('.chip').forEach(chip => {
      chip.onclick = () => {
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        authorFilter = chip.getAttribute('data-author');
        renderCalendar();
        renderList();
      };
    });

    document.getElementById('todayBtn').onclick = () => {
      selectedDate = todayStr;
      viewYear = Number(todayStr.slice(0, 4));
      viewMonth = Number(todayStr.slice(5, 7)) - 1;
      renderCalendar();
      renderList();
      updateFormDate();
    };

    document.getElementById('prevMonth').onclick = () => {
      viewMonth--;
      if (viewMonth < 0) { viewMonth = 11; viewYear--; }
      renderCalendar();
    };

    document.getElementById('nextMonth').onclick = () => {
      viewMonth++;
      if (viewMonth > 11) { viewMonth = 0; viewYear++; }
      renderCalendar();
    };

    document.getElementById('saveBtn').onclick = async () => {
      const merchant = document.getElementById('merchant').value.trim();
      const amount = Number(document.getElementById('amount').value);
      if (!amount || amount <= 0) {
        setStatus('금액을 1원 이상 입력해 주세요.');
        return;
      }

      const item = {
        date: selectedDate,
        author: document.getElementById('author').value,
        category: document.getElementById('category').value,
        merchant,
        amount,
        payment: document.getElementById('payment').value,
        memo: document.getElementById('memo').value.trim()
      };

      closeAddModal();
      setStatus('저장 중...');
      try {
        const saved = await apiPost({ action: 'add', item });
        expenses.push({ ...saved, author: normalizeAuthor(saved.author) });
        document.getElementById('merchant').value = '';
        document.getElementById('amount').value = '';
        document.getElementById('memo').value = '';
        setStatus('저장 완료');
        renderCalendar();
        renderList();
      } catch (err) {
        setStatus('저장 실패: ' + err.message);
      }
    };

    document.getElementById('updateItemBtn').onclick = async () => {
      const id = document.getElementById('editId').value;
      const amount = Number(document.getElementById('editAmount').value);
      if (!amount || amount <= 0) {
        setStatus('금액을 1원 이상 입력해 주세요.');
        return;
      }

      const item = {
        id,
        date: document.getElementById('editDate').value,
        author: document.getElementById('editAuthor').value,
        category: document.getElementById('editCategory').value,
        merchant: document.getElementById('editMerchant').value.trim(),
        amount,
        payment: document.getElementById('editPayment').value,
        memo: document.getElementById('editMemo').value.trim()
      };

      closeEditModal();
      setStatus('수정 중...');
      try {
        const updated = await apiPost({ action: 'update', item });
        const normalized = { ...updated, author: normalizeAuthor(updated.author) };
        expenses = expenses.map(e => String(e.id) === String(normalized.id) ? normalized : e);
        selectedDate = normalized.date;
        viewYear = Number(normalized.date.slice(0, 4));
        viewMonth = Number(normalized.date.slice(5, 7)) - 1;
        setStatus('수정 완료');
        renderCalendar();
        renderList();
        updateFormDate();
      } catch (err) {
        setStatus('수정 실패: ' + err.message);
      }
    };

    document.getElementById('deleteItemBtn').onclick = async () => {
      const id = document.getElementById('editId').value;
      closeEditModal();
      setStatus('삭제 중...');
      try {
        const res = await apiPost({ action: 'delete', id });
        expenses = expenses.filter(e => String(e.id) !== String(res.deletedId));
        setStatus('삭제 완료');
        renderCalendar();
        renderList();
      } catch (err) {
        setStatus('삭제 실패: ' + err.message);
      }
    };

    document.getElementById('closeModalBtn').onclick = closeEditModal;

    renderSelectOptions();
    renderCalendar();
    renderList();
    updateFormDate();
    setStatus('데이터 불러오는 중...');
    apiGetInit()
      .then(data => {
        const rows = Array.isArray(data.expenses) ? data.expenses : [];
        expenses = rows.map(row => ({ ...row, author: normalizeAuthor(row.author) }));
        if (data.settings) {
          if (Array.isArray(data.settings.categories) && data.settings.categories.length > 0) {
            categories = data.settings.categories;
          }
          if (Array.isArray(data.settings.payments) && data.settings.payments.length > 0) {
            payments = data.settings.payments;
          }
          renderSelectOptions();
        }
        setStatus('');
        renderCalendar();
        renderList();
      })
      .catch(err => setStatus('불러오기 실패: ' + err.message));
  </script>
</body>
</html>
